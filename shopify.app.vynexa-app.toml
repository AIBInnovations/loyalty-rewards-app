# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c5bacf4ba2d0b6272ad545bf2507f50c"
name = "Vynexa App"
application_url = "https://vynexa-app-1.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [
  "products/create",
  "products/delete",
  "products/update",
  "app/uninstalled"
]
  uri = "/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_discounts,read_orders,read_products,write_customers,write_discounts"

[auth]
redirect_urls = [
  "https://vynexa-app-1.onrender.com/auth/callback"
]

[app_proxy]
# subpath/prefix must stay identical to the other configs — the storefront
# widget JS has "/apps/loyalty/..." hardcoded in its fetch calls, so a
# different value here would 404 every storefront request for shops
# installed through this app.
url = "https://vynexa-app-1.onrender.com/api/proxy"
subpath = "loyalty"
prefix = "apps"

[pos]
embedded = false
