services:
  - type: web
    name: loyalty-rewards-app
    runtime: docker
    region: singapore  # Closest to India
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false  # Set to your Render URL after first deploy
      # Additional Shopify app registrations served by THIS service (one
      # custom-distribution app per store) — see app/.server/shopify-apps.server.ts.
      # JSON array: [{"name":"store","apiKey":"<client id>","apiSecret":"<client secret>"}]
      # Every app listed must use this service's URL in its shopify.app.<name>.toml.
      # Onboarding a store = add one entry here; no new Render service.
      - key: SHOPIFY_APPS
        sync: false
      - key: SCOPES
        value: read_customers,write_customers,read_orders,read_checkouts,write_discounts,read_discounts,read_products
      - key: PORT
        value: 3000
      - key: HF_API_TOKEN
        sync: false  # Set manually in Render dashboard — get free token at huggingface.co/settings/tokens
      # REQUIRED — the app throws at boot if these are unset (app/env.server.ts,
      # crypto.server.ts, admin-auth.server.ts). Set actual values in the
      # Render dashboard; keep them distinct from SHOPIFY_API_SECRET.
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"  # SESSION_SECRET
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"     # TOKEN_ENCRYPTION_KEY
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Required for the ElevenLabs voice webhook — it rejects all callbacks
      # when unset rather than accepting unsigned requests.
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false

  # LEGACY — to be removed. Vynexa is a separate Shopify app registration
  # (client_id in shopify.app.vynexa.toml) that predates SHOPIFY_APPS, when
  # one service could only authenticate as one app. Once its credentials are
  # in loyalty-rewards-app's SHOPIFY_APPS and its TOML points at that
  # service's URL (then `shopify app deploy --config vynexa`), delete this
  # service. Same for denzlabel-app below.
  - type: web
    name: vynexa-app
    runtime: docker
    region: singapore
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Same Atlas cluster as loyalty-rewards-app — shared data by design
      - key: SHOPIFY_API_KEY
        sync: false  # Vynexa's client ID (539db39b9b944e7c9f794f52122735a0)
      - key: SHOPIFY_API_SECRET
        sync: false  # Vynexa's client secret
      - key: SHOPIFY_APP_URL
        sync: false  # Set to this service's Render URL after first deploy
      - key: SCOPES
        value: read_customers,write_customers,read_orders,read_checkouts,write_discounts,read_discounts,read_products
      - key: PORT
        value: 3000
      - key: HF_API_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false  # Generate a fresh one — do not reuse loyalty-rewards-app's
      - key: TOKEN_ENCRYPTION_KEY
        sync: false  # Generate a fresh one — do not reuse loyalty-rewards-app's
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false

  # Third identity — custom-distributed specifically for denzlabel.myshopify.com
  # (client_id in shopify.app.denzlabel.toml). Same "one Render service per
  # Shopify app registration" rule as vynexa-app above.
  - type: web
    name: denzlabel-app
    runtime: docker
    region: singapore
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Same Atlas cluster as the other apps — shared data by design
      - key: SHOPIFY_API_KEY
        sync: false  # denzlabel app's client ID (305a768a7c056fd154463e4a607f2e70)
      - key: SHOPIFY_API_SECRET
        sync: false  # denzlabel app's client secret
      - key: SHOPIFY_APP_URL
        sync: false  # Set to this service's Render URL after first deploy
      - key: SCOPES
        value: read_customers,write_customers,read_orders,read_checkouts,write_discounts,read_discounts,read_products
      - key: PORT
        value: 3000
      - key: HF_API_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false  # Generate a fresh one — do not reuse another service's
      - key: TOKEN_ENCRYPTION_KEY
        sync: false  # Generate a fresh one — do not reuse another service's
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
