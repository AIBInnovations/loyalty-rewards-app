services:
  - type: web
    name: loyalty-rewards-app
    runtime: docker
    region: singapore  # Closest to India
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false  # Set to your Render URL after first deploy
      - key: SCOPES
        value: read_customers,write_customers,read_orders,read_checkouts,write_discounts,read_discounts,read_products
      - key: PORT
        value: 3000
      - key: HF_API_TOKEN
        sync: false  # Set manually in Render dashboard — get free token at huggingface.co/settings/tokens
      # REQUIRED — the app throws at boot if these are unset (app/env.server.ts,
      # crypto.server.ts, admin-auth.server.ts). Set actual values in the
      # Render dashboard; keep them distinct from SHOPIFY_API_SECRET.
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"  # SESSION_SECRET
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"     # TOKEN_ENCRYPTION_KEY
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Required for the ElevenLabs voice webhook — it rejects all callbacks
      # when unset rather than accepting unsigned requests.
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
